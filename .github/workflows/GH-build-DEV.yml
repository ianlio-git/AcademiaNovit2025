name: CI/CD GH-build-DEV

on:
  push:
    branches: [ development ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Instalar .NET SDK 9.0.300
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.300'

    - name: Restaurar dependencias
      run: dotnet restore

    - name: Compilar el proyecto
      run: dotnet build --no-restore --configuration Release

    - name: Ejecutar tests
      run: dotnet test --no-build --verbosity normal

    - name: Enviar email con PowerShell (SMTP)
      shell: pwsh
      run: |
        $smtpServer = "app.debugmail.io"
        $smtpPort = 25
        $smtpUser = "${{ secrets.DEBUGMAIL_USERNAME }}"
        $smtpPass = "${{ secrets.DEBUGMAIL_PASSWORD }}"
        $from = "john.doe@example.org"
        $to = "test@debugmail.io"
        $subject = "✅ CI/CD finalizado correctamente"
        $body = "El pipeline GH-build-DEV en la rama development finalizó correctamente."

        $message = New-Object System.Net.Mail.MailMessage $from, $to, $subject, $body
        $smtp = New-Object Net.Mail.SmtpClient($smtpServer, $smtpPort)
        $smtp.EnableSsl = $false
        $smtp.Credentials = New-Object System.Net.NetworkCredential($smtpUser, $smtpPass)
        $smtp.Send($message)
