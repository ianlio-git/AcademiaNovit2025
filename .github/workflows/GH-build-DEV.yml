name: CI/CD GH-build-DEV

on:
  push:
    branches: [development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Instalar .NET SDK 9.0.201
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.201"

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar el proyecto
        run: dotnet build --no-restore

      - name: Ejecutar tests
        run: dotnet test --no-build --verbosity normal

      - name: Enviar email de finalización
        env:
          USER: ${{ secrets.DEBUGMAIL_USER }}
          PASS: ${{ secrets.DEBUGMAIL_PASS }}
        run: |
          curl -X POST https://api.debugmail.io/v1/messages \
            -u "$USER:$PASS" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "ci@academianovit.local",
              "to": ["test@debugmail.io"],
              "subject": "✅ CI/CD AcademiaNovit - Pipeline completado",
              "html": "<p>El pipeline <strong>GH-build-DEV</strong> finalizó exitosamente en la rama <code>development</code>.</p>"
            }'
