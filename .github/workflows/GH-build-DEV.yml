name: CI/CD GH-build-DEV

on:
  push:
    branches: [ development ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Instalar .NET SDK 9.0.300
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.300'

    - name: Restaurar dependencias
      run: dotnet restore

    - name: Compilar el proyecto
      run: dotnet build --no-restore --configuration Release

    - name: Ejecutar tests
      run: dotnet test --no-build --verbosity normal

    - name: Enviar email de notificación
      run: |
        curl -X POST https://api.debugmail.io/v1/messages \
          -H "Content-Type: application/json" \
          -d '{
            "subject": "✅ CI/CD finalizó correctamente",
            "body": "El pipeline GH‑build‑DEV en development se completó con éxito.",
            "to": [{"email": "test@debugmail.io"}]
          }' \
          -u "${{ secrets.DEBUGMAIL_USERNAME }}:${{ secrets.DEBUGMAIL_PASSWORD }}"
